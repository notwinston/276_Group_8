<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4 mb-5">
    <a class="navbar-brand fw-bold" href="/login">Summit SFU</a>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 p-4">
                <h3 class="mb-3 fw-bold text-center">Create Account</h3>

                <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

                <form action="/register" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 mt-2">Register</button>
                </form>

                <div class="text-center mt-3">
                    <small class="text-muted">Already have an account? <a href="/login">Sign in</a></small>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
