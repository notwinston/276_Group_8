spring.application.name=demo
server.port=${PORT:8080}

# Uses Render PostgreSQL if DB_URL is set; otherwise falls back to local H2
spring.datasource.url=${DB_URL:jdbc:h2:mem:grouptabledb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate (auto-detects PostgreSQL on Render and H2 locally)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true