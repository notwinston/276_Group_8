<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Summit SFU - Admin dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4 mb-4">
    <span class="navbar-brand fw-bold">Summit SFU - Admin Portal</span>
    <div class="d-flex align-items-center gap-2">
        <a href="/dashboard" class="btn btn-outline-secondary btn-sm text-light">Switch to User View</a>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm border-0 p-4 mb-4">
        <h2 class="fw-bold mb-1">Admin Control Panel</h2>
        <p class="text-muted mb-0">
            Logged in as <strong th:text="${user.username}">admin</strong>
            (<span th:text="${user.email}">admin@example.com</span>)
        </p>
    </div>

    <div class="card shadow-sm border-0 p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">All Registered Users in Database</h5>
            <span class="badge bg-dark" th:text="${#lists.size(users) + ' Total Users'}"></span>
        </div>

        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th>UID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th class="text-end">Admin Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.uid}">1</td>
                    <td class="fw-semibold" th:text="${u.username}">username</td>
                    <td th:text="${u.email}">email@example.com</td>
                    <td>
                        <span class="badge"
                              th:classappend="${u.role.name() == 'ADMIN'} ? 'bg-danger' : 'bg-secondary'"
                              th:text="${u.role}">USER</span>
                    </td>
                    <td class="text-end">
                        <div th:if="${u.uid != user.uid}" class="d-inline-flex gap-2">
                            <form th:action="@{/admin/users/{id}/toggle-role(id=${u.uid})}" method="post">
                                <button type="submit" class="btn btn-sm btn-outline-dark"
                                        th:text="${u.role.name() == 'ADMIN'} ? 'Demote to User' : 'Make Admin'">
                                </button>
                            </form>
                            <form th:action="@{/admin/users/{id}/delete(id=${u.uid})}" method="post"
                                  onsubmit="return confirm('Delete this user?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </div>
                        <span th:if="${u.uid == user.uid}" class="text-muted small fst-italic">Current Admin</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
